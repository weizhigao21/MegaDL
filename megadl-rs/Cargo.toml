[package]
name = "megadl"
version = "0.1.4"
edition = "2021"
description = "MEGA 公共链接下载器（MegaDownloader 逆向重构）"
license = "MIT"

[dependencies]
aes = "0.8"
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "socks"] }
dirs = "5"
rfd = "0.15"
arboard = "3"
eframe = "0.29"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
strip = true
